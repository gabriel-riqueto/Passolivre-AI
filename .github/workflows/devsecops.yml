name: PassoLivre AI - DevSecOps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  security-build:
    name: Testes e Seguranca
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pytest semgrep

      - name: Executar testes
        run: python -m pytest -q

      - name: Gitleaks - Detectar segredos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep - Analise estatica
        run: semgrep scan --config p/python --config .semgrep.yml --error

      - name: Construir imagem Docker
        run: docker build --pull -t passolivre:ci .

      - name: Trivy - Relatorio completo
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: passolivre:ci
          scan-type: image
          format: table
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: false
          output: trivy-completo.txt

      - name: Salvar relatorio de vulnerabilidades
        uses: actions/upload-artifact@v4
        with:
          name: trivy-relatorio-completo
          path: trivy-completo.txt

      - name: Trivy - Bloquear vulnerabilidades corrigiveis
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: passolivre:ci
          scan-type: image
          format: table
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Definir nome da imagem
        if: github.event_name == 'push' && github.ref == 'refs/heads/devsecops-cloud'
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"

      - name: Autenticar no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/devsecops-cloud'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/devsecops-cloud'
        run: docker tag passolivre:ci "$IMAGE" && docker push "$IMAGE"